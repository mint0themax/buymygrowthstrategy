<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thanks 💖</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      overflow: hidden; 
    }
    
    body {
      background: #FFEAF6;
      display: flex; 
      align-items: center; 
      justify-content: center;
      min-height: 100vh; 
      padding: 16px; 
      position: relative;
      font-family: "Comic Neue", "Comic Sans MS", "Comic Sans", cursive !important;
      box-sizing: border-box;
    }

    .emoji {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      font-size: 18px;
      opacity: 0.8;
      animation: float 18s linear infinite;
    }
    
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-120vh) rotate(360deg); }
    }

    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
      z-index: 2;
      position: relative;
      padding: 40px 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      gap: 20px;
    }

    h1 {
      color: #333;
      font-size: 2.2rem;
      margin: 0;
      line-height: 1.3;
    }

    p {
      color: #666;
      font-size: 1.1rem;
      margin: 0;
      line-height: 1.5;
    }

    .status {
      font-size: 0.95rem;
      color: #888;
      font-style: italic;
    }

    .status.sending {
      color: #ED70C8;
    }

    .status.success {
      color: #10b981;
    }

    .status.error {
      color: #ef4444;
    }

    .link-button {
      background: #ED70C8;
      color: white;
      text-decoration: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: "Comic Neue", "Comic Sans MS", "Comic Sans", cursive !important;
      display: inline-block;
      margin-top: 10px;
    }

    .link-button:hover {
      background: #D239A4;
      box-shadow: 0 10px 25px rgba(237, 112, 200, 0.4);
      transform: translateY(-2px);
    }

    .link-button:active {
      transform: translateY(0);
    }

    @media (max-width: 500px) {
      .card {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>thank you! 💖</h1>
    <p>your message has been received</p>
    <div class="status" id="status">sending your message...</div>
    <a href="https://buymygrowthstrategy.com/" class="link-button">send another message</a>
  </div>

  <script>
    const emojis = ['💖','✨'];
    const num = 88;
    const body = document.body;

    for (let i = 0; i < num; i++) {
      const span = document.createElement('span');
      span.classList.add('emoji');
      span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      span.style.left = Math.random() * 100 + 'vw';
      span.style.top = Math.random() * 120 + 'vh';
      span.style.fontSize = (10 + Math.random() * 20) + 'px';
      span.style.animationDuration = (10 + Math.random() * 20) + 's';
      span.style.animationDelay = (Math.random() * -20) + 's';
      body.appendChild(span);
    }
  </script>

  <script>
    const statusEl = document.getElementById('status');
    
    async function sendToGoogleSheets() {
      const twitter = sessionStorage.getItem('customerTwitter');
      const message = sessionStorage.getItem('customerMessage');
      const pendingSubmission = sessionStorage.getItem('pendingSubmission');

      // Only send if we have pending data
      if (!pendingSubmission || !twitter || !message) {
        statusEl.textContent = 'no message to send';
        statusEl.className = 'status';
        return;
      }

      try {
        statusEl.textContent = 'sending your message...';
        statusEl.className = 'status sending';

        const response = await fetch('https://script.google.com/macros/s/AKfycby_vaRtMTix9msPd5qTU_ZMqUOzMH8EP8NkyGUHKwU3RGrupSqfFeN1SzUSghsvkvVG/exec', {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            twitter: twitter,
            message: message,
            timestamp: new Date().toISOString()
          })
        });

        // Clear the data after successful send
        sessionStorage.removeItem('customerTwitter');
        sessionStorage.removeItem('customerMessage');
        sessionStorage.removeItem('pendingSubmission');

        statusEl.textContent = '✓ message sent successfully!';
        statusEl.className = 'status success';

      } catch (error) {
        console.error('Error sending to Google Sheets:', error);
        statusEl.textContent = 'message received (sending in background)';
        statusEl.className = 'status';
        
        // Still clear the data to prevent resubmission
        sessionStorage.removeItem('customerTwitter');
        sessionStorage.removeItem('customerMessage');
        sessionStorage.removeItem('pendingSubmission');
      }
    }

    // Send data when page loads
    sendToGoogleSheets();
  </script>
</body>
</html>
