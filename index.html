<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy My Growth Strategy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    
    body {
      background: #FFEAF6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      position: relative;
      font-family: "Comic Neue", "Comic Sans MS", "Comic Sans", cursive !important;
      box-sizing: border-box;
    }

    /* Floating emoji background */
    .emoji {
      position: absolute;
      font-size: 20px;
      opacity: 0.8;
      animation: float 20s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-120vh) rotate(360deg); }
    }

    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
      z-index: 2;
      position: relative;
      padding: 30px 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    h2 {
      color: #333;
      font-size: 1.7rem;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea, input {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
      text-align: left;
      transition: border-color 0.3s ease;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    textarea:focus, input:focus {
      border-color: #ED70C8;
      outline: none;
    }

    textarea.error, input.error {
      border-color: #ef4444;
    }

    textarea::placeholder,
    input::placeholder {
      color: #a0aec0;
      font-style: italic;
    }

    .error-message {
      color: #ef4444;
      font-size: 0.875rem;
      text-align: left;
      margin-top: -8px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .buy-button {
      background: #ED70C8;
      box-sizing: border-box;
      text-decoration: none;
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      font-family: "Comic Neue", "Comic Sans MS", "Comic Sans", cursive !important;
      margin-top: 8px;
    }

    .buy-button:hover {
      background: #D239A4;
      box-shadow: 0 10px 25px rgba(237, 112, 200, 0.4);
      transform: translateY(-2px);
    }

    .buy-button:active {
      transform: translateY(0);
    }

    .buy-button:focus {
      outline: none;
    }

    @media (max-width: 500px) {
      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>💖buy my growth strategy💖</h2>
    <form id="purchaseForm">
      <div>
        <textarea id="message" name="message" placeholder="tell me something interesting 🥺" required></textarea>
        <div class="error-message" id="messageError">Please enter a message</div>
      </div>
      
      <div>
        <input type="url" id="twitter" name="twitter" placeholder="https://x.com/yourusername" required>
        <div class="error-message" id="twitterError">Please enter a valid URL</div>
      </div>
      
      <button type="submit" class="buy-button">
        tip to send a message
      </button>
    </form>
  </div>

  <script>
    const emojis = ['💖','✨'];
    const num = 88;
    const body = document.body;

    for (let i = 0; i < num; i++) {
      const span = document.createElement('span');
      span.classList.add('emoji');
      span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      span.style.left = Math.random() * 100 + 'vw';
      span.style.top = Math.random() * 120 + 'vh';
      span.style.fontSize = (10 + Math.random() * 20) + 'px';
      span.style.animationDuration = (10 + Math.random() * 20) + 's';
      span.style.animationDelay = (Math.random() * -20) + 's';
      body.appendChild(span);
    }
  </script>
  
  <script>
    const twitterInput = document.getElementById('twitter');
    const messageInput = document.getElementById('message');
    const messageError = document.getElementById('messageError');
    const twitterError = document.getElementById('twitterError');
    const prefix = 'https://x.com/';
  
    twitterInput.addEventListener('focus', () => {
      if (!twitterInput.value) {
        twitterInput.value = prefix;
        setTimeout(() => {
          twitterInput.setSelectionRange(prefix.length, prefix.length);
        });
      }
    });
  
    twitterInput.addEventListener('input', () => {
      if (!twitterInput.value.startsWith(prefix)) {
        twitterInput.value = prefix;
        twitterInput.setSelectionRange(prefix.length, prefix.length);
      }
    });

    document.getElementById('purchaseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      let isValid = true;

      // Reset error states
      messageInput.classList.remove('error');
      twitterInput.classList.remove('error');
      messageError.classList.remove('show');
      twitterError.classList.remove('show');

      // Validate message
      if (!messageInput.value.trim()) {
        messageInput.classList.add('error');
        messageError.classList.add('show');
        isValid = false;
      }

      // Validate Twitter URL
      if (!twitterInput.value.trim() || !twitterInput.validity.valid || twitterInput.value === prefix) {
        twitterInput.classList.add('error');
        twitterError.classList.add('show');
        isValid = false;
      }

      if (isValid) {
        const twitter = twitterInput.value;
        const message = messageInput.value;
        
        // Store data in sessionStorage (more secure than localStorage for temporary data)
        sessionStorage.setItem('customerTwitter', twitter);
        sessionStorage.setItem('customerMessage', message);
        sessionStorage.setItem('pendingSubmission', 'true');
        
        // Redirect to Stripe checkout
        window.location.href = 'https://buy.stripe.com/cNi4gs6FT83S7bl1qC7AI00';
      }
    });
  </script>
</body>
</html>
