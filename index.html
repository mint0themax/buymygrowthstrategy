<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy My Growth Strategy</title>

  <style>
    body {
      background: #FFE5F6;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* floating emoji container */
    .emoji {
      position: absolute;
      font-size: 20px;
      opacity: 0.8;
      animation: float 20s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-120vh) rotate(360deg); }
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.4);
      max-width: 400px;
      width: 100%;
      z-index: 2;
      position: relative;
      text-align: center;
      margin: auto;
      display: block;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    textarea, input {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-family: inherit;
      margin-bottom: 20px;
    }

    .buy-button {
      background: #ED70C8;
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
    }

    .buy-button:hover {
      background: #D239A4;
      box-shadow: 0 10px 25px rgba(237, 112, 200, 0.4);
      transform: translateY(-2px);
    }

    .buy-button:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <h2>Tell me something interesting 🥺</h2>
    <form id="purchaseForm">
      <textarea id="message" name="message" placeholder="make it interesting"></textarea>
      <input type="url" id="twitter" name="twitter" placeholder="https://twitter.com/yourusername" required>
      <button type="submit" class="buy-button">send this for $1</button>
    </form>
  </div>

  <script>
    const emojis = ['💖','✨'];
    const num = 88; // number of emojis
    const body = document.body;

    for (let i = 0; i < num; i++) {
      const span = document.createElement('span');
      span.classList.add('emoji');
      span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      span.style.left = Math.random() * 100 + 'vw';
      span.style.top = Math.random() * 120 + 'vh';
      span.style.fontSize = (10 + Math.random() * 20) + 'px';
      span.style.animationDuration = (10 + Math.random() * 20) + 's';
      span.style.animationDelay = (Math.random() * -20) + 's';
      body.appendChild(span);
    }
  </script>
</body>
</html>
