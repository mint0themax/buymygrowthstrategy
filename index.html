<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buy My Growth Strategy</title>

  <style>
    /* Base background */
    html, body {
      height: 100%;
      background: #FFE5F6;
    }
    body {
      font-family: "Comic Sans MS", "Comic Sans", cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      position: relative; /* for stacking context */
      overflow-x: hidden;
    }

    /* Floating emoji background layers */
    .emoji-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;                 /* sits above the pink bg, below content */
      background-repeat: repeat;
      background-size: var(--tile, 80px) var(--tile, 80px);
      opacity: 0.75;
      will-change: background-position;
    }
    .emoji-layer.layer-1 { animation: scroll-1 40s linear infinite; }
    .emoji-layer.layer-2 { animation: scroll-2 55s linear infinite; opacity: 0.6; }
    .emoji-layer.layer-3 { animation: scroll-3 70s linear infinite; opacity: 0.5; }

    @keyframes scroll-1 { from { background-position: 0 0; }   to { background-position: 100% 100%; } }
    @keyframes scroll-2 { from { background-position: 0 0; }   to { background-position: -100% 100%; } }
    @keyframes scroll-3 { from { background-position: 0 0; }   to { background-position: 100% -100%; } }

    /* Content wrapper sits above layers */
    .site-wrap { position: relative; z-index: 1; width: 100%; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 0;
      box-shadow: 0 25px 70px rgba(0,0,0,0.4);
      max-width: 400px;
      width: 100%;
      overflow: hidden;
      margin: 0 auto;
    }

    .form-section { padding: 50px 45px; }
    h1 { font-size: 2rem; color: #1a202c; margin-bottom: 40px; font-weight: 400; line-height: 1.3; }
    .form-group { margin-bottom: 28px; text-align: left; }
    label { display:block; margin-bottom:10px; color:#4a5568; font-weight:500; font-size:1rem; }
    input, textarea {
      width:100%; padding:14px 18px; border:2px solid #e2e8f0; border-radius:8px;
      font-size:1rem; font-family:inherit; transition:border-color .3s ease; background:white;
    }
    input:focus, textarea:focus { outline:none; border-color:#ED70C8; }
    textarea { resize:vertical; min-height:120px; }

    .buy-button {
      background:#ED70C8; color:white; border:none; padding:18px 40px; font-size:1.2rem; font-weight:600;
      border-radius:8px; cursor:pointer; transition:all .3s ease; width:100%; margin-top:15px;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
    }
    .buy-button:hover { background:#D239A4; color:white; transform:translateY(-2px); box-shadow:0 10px 25px rgba(237,112,200,.4); }
    .buy-button:active { transform:translateY(0); }
    .buy-button:disabled { opacity:.7; cursor:not-allowed; }

    @media (max-width: 600px) {
      .card { border-radius: 16px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <!-- moving emoji layers (inserted by JS below) -->

  <div class="site-wrap">
    <div class="card">
      <div class="form-section">
        <h1>Tell me something interesting</h1>
        <form id="purchaseForm">
          <div class="form-group">
            <textarea id="message" name="message" placeholder="make it interesting"></textarea>
          </div>
          <div class="form-group">
            <label for="twitter">what's your twitter</label>
            <input type="url" id="twitter" name="twitter" placeholder="https://twitter.com/yourusername" required>
          </div>
          <button type="submit" class="buy-button">send this message for $1</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Build a tiny SVG tile with a centered emoji
    function svgEmoji(emoji) {
      const svg =
        `<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'>
           <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='48'>${emoji}</text>
         </svg>`;
      return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
    }

    // Create layers AFTER the body exists
    (function(){
      const layers = [
        { cls: 'layer-1', emoji: '💖', size: 90 },
        { cls: 'layer-2', emoji: '🫶', size: 80 },
        { cls: 'layer-3', emoji: '✨', size: 70 },
      ];
      layers.forEach(({ cls, emoji, size }, i) => {
        const layer = document.createElement('div');
        layer.className = `emoji-layer ${cls}`;
        layer.style.setProperty('--tile', `${size}px`);
        layer.style.backgroundImage = svgEmoji(emoji);
        layer.style.animationDelay = `${-i * 5}s`;
        document.body.appendChild(layer);
      });
    })();
  </script>

  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script>
    document.getElementById('purchaseForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const twitter = document.getElementById('twitter').value;
      const message = document.getElementById('message').value;
      const button = document.querySelector('.buy-button');
      button.textContent = 'sending...'; button.disabled = true;
      try {
        await fetch('https://script.google.com/macros/s/AKfycby_vaRtMTix9msPd5qTU_ZMqUOzMH8EP8NkyGUHKwU3RGrupSqfFeN1SzUSghsvkvVG/exec', {
          method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ twitter, message })
        });
        window.location.href = 'https://buy.stripe.com/test_dRm6oIccR3xf06H1O35AQ00';
      } catch (err) {
        console.error(err);
        window.location.href = 'https://buy.stripe.com/test_dRm6oIccR3xf06H1O35AQ00';
      }
    });
  </script>
</body>
</html>
